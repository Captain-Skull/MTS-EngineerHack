name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  K8S_API_HOST: 127.0.0.1

jobs:
  lint:
    name: Статические проверки
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Секреты в истории Git (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Инструменты (зафиксированные версии)
        run: ./scripts/install-tools.sh && echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Shell-скрипты (shellcheck)
        env:
          LANG: C.UTF-8
          SHELLCHECK_VERSION: v0.11.0
        run: |
          base="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}"
          curl -fsSL "${base}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" | tar -xz
          "./shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version | head -2
          "./shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x deploy.sh scripts/*.sh

      - name: YAML (yamllint)
        run: pipx run yamllint==1.38.0 -c .yamllint.yaml .

      - name: Ansible (syntax-check + ansible-lint)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: |
          ansible-playbook -i ansible/inventory/local.ini ansible/site.yml --syntax-check
          pipx run --spec ansible-lint==26.9.0 ansible-lint ansible/

      - name: Конфигурация Renovate
        run: npx --yes --package renovate@44.132.2 -- renovate-config-validator --strict

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/fluentd/Dockerfile
          config: .hadolint.yaml

      - name: Helm-чарты (helm lint)
        run: for c in charts/*/; do helm lint "$c"; done

      - name: Рендеринг всей платформы (helmfile template)
        run: |
          export HELM_DATA_HOME=$PWD/.helm/data HELM_CACHE_HOME=$PWD/.helm/cache HELM_CONFIG_HOME=$PWD/.helm/config
          helmfile --file helmfile/helmfile.yaml.gotmpl template --skip-tests > rendered.yaml
          { echo '---'; cat helmfile/namespaces.yaml; } >> rendered.yaml

      - name: Валидация манифестов по схемам Kubernetes и CRD (kubeconform)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - name: Безопасность конфигураций (Trivy misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: charts/
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    name: E2E на Ubuntu 24.04 (kubeadm)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      FLUENTD_IMAGE_REPOSITORY: ci.local/fluentd-k8s-loki
      FLUENTD_IMAGE_TAG: ci
      GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
      GITOPS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Освободить место и отключить Docker (runtime кластера — containerd)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Сборка образа Fluentd из исходников PR (не публикуется и не подписывается)
        run: docker build -t "${FLUENTD_IMAGE_REPOSITORY}:${FLUENTD_IMAGE_TAG}" images/fluentd

      - name: make cluster — kubeadm на этом runner-е (all-in-one)
        run: make cluster

      - name: Загрузить образ Fluentd в containerd кластера
        run: docker save "${FLUENTD_IMAGE_REPOSITORY}:${FLUENTD_IMAGE_TAG}" | sudo ctr -n k8s.io images import -

      - name: make platform — helmfile apply
        run: make platform

      - name: Идемпотентность — повторный запуск без изменений
        run: |
          make cluster 2>&1 | tee ansible-rerun.log
          if ! grep -qE 'changed=0 ' ansible-rerun.log; then
            grep -B4 -E '^changed:' ansible-rerun.log | grep -E '^(TASK|changed:)' | head -10 | sed 's/^/::error title=Ansible changed::/'
            exit 1
          fi
          ./scripts/platform.sh diff 2>&1 | tee helmfile-diff.log
          if grep -qE '^(\+|-) ' helmfile-diff.log; then
            grep -E 'has changed|^(\+|-) ' helmfile-diff.log | head -10 | sed 's/^/::error title=helmfile diff::/'
            exit 1
          fi

      - name: make test — smoke-тесты
        run: make test

      - name: make cis — CIS Kubernetes Benchmark (kube-bench), только принятые отклонения
        run: make cis

      - name: make chaos — сбои под нагрузкой без ошибок для клиентов
        run: make chaos

      - name: make rollout — Flagger продвигает исправную версию и откатывает неисправную
        run: make rollout

      - name: Учебное восстановление etcd из снапшота
        run: |
          make etcd-drill
          make test

      - name: Диагностика при ошибке
        if: failure()
        run: |
          export KUBECONFIG=$PWD/.state/kubeconfig PATH=$PWD/.bin:$PATH
          mkdir -p diag
          kubectl get all,gateway,httproute,certificate -A -o wide > diag/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          kubectl describe pods -A > diag/pods.txt 2>&1 || true
          kubectl get pods -A --no-headers 2>/dev/null | grep -v -E 'Running|Completed' | head -8 | sed 's/^/::error title=pod not running::/' || true
          kubectl get gateway -A -o wide --no-headers 2>/dev/null | sed 's/^/::error title=gateway::/' || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: diag/
