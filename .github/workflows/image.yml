name: image

on:
  push:
    branches: [main]
    paths: [images/fluentd/**, .github/workflows/image.yml]
  pull_request:
    paths: [images/fluentd/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: 1.19.3-1

jobs:
  fluentd:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Имя образа в нижнем регистре
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fluentd-k8s-loki" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/fluentd
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Уязвимости (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request'
      - name: Подпись образа (cosign keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
