name: image

on:
  push:
    branches: [main]
    paths: [images/fluentd/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: 1.19.3-1

jobs:
  fluentd:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluentd-k8s-loki
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/fluentd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Уязвимости (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fluentd-k8s-loki@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Подпись образа (cosign keyless)
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fluentd-k8s-loki@${{ steps.build.outputs.digest }}"
