- name: Базовые пакеты
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, conntrack, socat, ethtool, jq, nfs-common, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: common_apt
  retries: 5
  delay: 10
  until: common_apt is succeeded

- name: Отключить swap сейчас
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: true

- name: Отключить swap в fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Модули ядра для container runtime и сетевого моста
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Загрузить модули
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Параметры ядра для Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Текущие лимиты inotify
  ansible.builtin.command: sysctl -n {{ item.key }}
  loop: "{{ common_sysctl_min | dict2items }}"
  register: common_inotify
  changed_when: false

- name: Лимиты inotify не ниже требуемых (Fluentd и kubelet следят за множеством файлов)
  ansible.posix.sysctl:
    name: "{{ item.item.key }}"
    value: "{{ item.item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop: "{{ common_inotify.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stdout | int < item.item.value | int

- name: UFW не должен мешать трафику кластера (на облачных образах Ubuntu он выключен)
  ansible.builtin.command: ufw status
  register: common_ufw
  changed_when: false
  failed_when: false

- name: Предупреждение про UFW
  ansible.builtin.debug:
    msg: "UFW активен — убедитесь, что открыты порты 6443, 10250, 80, 443 и трафик между узлами"
  when: "'Status: active' in (common_ufw.stdout | default(''))"
