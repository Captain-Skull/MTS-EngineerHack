- name: Установленная версия containerd
  ansible.builtin.command: /usr/local/bin/containerd --version
  register: containerd_installed
  changed_when: false
  failed_when: false

- name: Установка containerd {{ containerd_version }}
  when: containerd_version not in (containerd_installed.stdout | default(''))
  block:
    - name: Скачать архив containerd
      ansible.builtin.get_url:
        url: "{{ containerd_archive_url }}"
        checksum: "sha256:{{ containerd_archive_url }}.sha256sum"
        dest: /tmp/containerd.tar.gz
        mode: "0644"
      register: containerd_archive
      retries: 5
      delay: 10
      until: containerd_archive is succeeded
    - name: Распаковать в /usr/local
      ansible.builtin.unarchive:
        src: /tmp/containerd.tar.gz
        dest: /usr/local
        remote_src: true
      notify: Restart containerd

- name: Установка runc {{ runc_version }}
  ansible.builtin.get_url:
    url: "{{ containerd_runc_base_url }}/runc.{{ node_arch }}"
    checksum: "sha256:{{ containerd_runc_base_url }}/runc.sha256sum"
    dest: /usr/local/sbin/runc
    mode: "0755"
  notify: Restart containerd
  register: containerd_download_1
  retries: 5
  delay: 10
  until: containerd_download_1 is succeeded

- name: Unit systemd для containerd
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service"
    dest: /etc/systemd/system/containerd.service
    mode: "0644"
  notify: Restart containerd
  register: containerd_download_2
  retries: 5
  delay: 10
  until: containerd_download_2 is succeeded

- name: Каталог конфигурации
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Конфигурация containerd (systemd cgroup driver)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Зеркала из переменной REGISTRY_MIRRORS (реестр=адрес[,реестр=адрес])
  ansible.builtin.set_fact:
    containerd_registry_mirrors: "{{ containerd_registry_mirrors | combine(containerd_mirrors_from_env) }}"
  vars:
    containerd_mirrors_from_env: >-
      {%- set out = {} -%}
      {%- for pair in registry_mirrors_env.split(',') if '=' in pair -%}
      {%- set reg = pair.split('=', 1)[0] | trim -%}
      {%- set url = pair.split('=', 1)[1] | trim -%}
      {%- set _ = out.update({reg: {'server': ('https://registry-1.docker.io' if reg == 'docker.io' else 'https://' ~ reg), 'mirrors': [url]}}) -%}
      {%- endfor -%}
      {{ out }}
  when: registry_mirrors_env | length > 0

- name: Каталог настроек systemd для containerd
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: "0755"

- name: Прокси для containerd
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY={{ proxy_http }}" "HTTPS_PROXY={{ proxy_https }}" "NO_PROXY={{ proxy_no }}"
    mode: "0644"
  when: proxy_env | length > 0
  notify: Restart containerd

- name: Без прокси для containerd
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d/http-proxy.conf
    state: absent
  when: proxy_env | length == 0
  notify: Restart containerd

- name: Каталоги зеркал реестров
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item.key }}"
    state: directory
    mode: "0755"
  loop: "{{ containerd_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Зеркала реестров (сначала исходный реестр, при его недоступности зеркало)
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ item.key }}/hosts.toml"
    mode: "0644"
  loop: "{{ containerd_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart containerd

- name: Запуск containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true

- name: Применить изменения до установки kubelet
  ansible.builtin.meta: flush_handlers

- name: Настройка crictl для containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
    mode: "0644"
