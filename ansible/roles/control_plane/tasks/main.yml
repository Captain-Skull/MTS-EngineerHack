- name: Каталог конфигурации kubeadm
  ansible.builtin.file:
    path: /etc/kubeadm
    state: directory
    mode: "0700"

- name: Ключ шифрования etcd уже есть?
  ansible.builtin.stat:
    path: /etc/kubernetes/encryption/config.yaml
  register: enc_config

- name: Сгенерировать ключ шифрования
  when: not enc_config.stat.exists
  block:
    - name: Каталог
      ansible.builtin.file:
        path: /etc/kubernetes/encryption
        state: directory
        mode: "0700"
    - name: Конфигурация EncryptionConfiguration (AES-GCM)
      ansible.builtin.copy:
        dest: /etc/kubernetes/encryption/config.yaml
        mode: "0600"
        content: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: EncryptionConfiguration
          resources:
            - resources: [secrets]
              providers:
                - aesgcm:
                    keys:
                      - name: key1
                        secret: {{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) | b64encode }}
                - identity: {}

- name: Политика аудита API server
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/kubernetes/audit-policy.yaml
    mode: "0600"

- name: Конфигурация kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubeadm/kubeadm-config.yaml
    mode: "0600"

- name: Кластер уже инициализирован?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/kubeadm/kubeadm-config.yaml --upload-certs
  when: not admin_conf.stat.exists
  changed_when: true

- name: kubeconfig для root и пользователя, запустившего Ansible
  ansible.builtin.include_tasks: kubeconfig.yml
  loop: "{{ ['root'] + ([ansible_env.SUDO_USER] if ansible_env.SUDO_USER | default('root') != 'root' else []) }}"
  loop_control:
    loop_var: kube_user

- name: kubeconfig на управляющую машину ({{ kubeconfig_local_path }})
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Права на локальный kubeconfig
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Кластер из одного узла — разрешить нагрузку на control-plane
  ansible.builtin.command: >
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    taint nodes {{ ansible_nodename }} node-role.kubernetes.io/control-plane:NoSchedule-
  when: groups['workers'] | default([]) | length == 0
  register: untaint
  changed_when: "'untainted' in untaint.stdout"
  failed_when: untaint.rc != 0 and 'not found' not in untaint.stderr

- name: Команда присоединения worker-узлов
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  register: join_cmd
  changed_when: false
  when: groups['workers'] | default([]) | length > 0

- name: Сохранить команду для worker-ов
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_cmd.stdout | default('') }}"
