- name: Каталог для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Ключ репозитория pkgs.k8s.io (v{{ kubernetes_minor }})
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  register: kubernetes_apt_key
  retries: 5
  delay: 10
  until: kubernetes_apt_key is succeeded

- name: Репозиторий Kubernetes
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/"
    suites: ["/"]
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: present

- name: Удалить репозиторий в старом формате
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

- name: Пакеты kubelet, kubeadm, kubectl {{ kubernetes_version }}
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubeadm={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - "kubectl={{ kubernetes_version }}-{{ kubernetes_deb_revision }}"
      - cri-tools
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  register: kubernetes_packages
  retries: 5
  delay: 10
  until: kubernetes_packages is succeeded

- name: Зафиксировать версии (apt-mark hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: IP узла для kubelet
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    mode: "0644"
  register: kubernetes_kubelet_defaults

- name: Включить kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Перезапуск kubelet после смены аргументов (если кластер уже создан)
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
  when: kubernetes_kubelet_defaults.changed and ('/etc/kubernetes/kubelet.conf' is file)
