- name: Проверка окружения
  hosts: k8s_cluster
  gather_facts: true
  tasks:
    - name: Поддерживается только Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] is version('24.04', '>=')
        fail_msg: "Решение тестировалось на Ubuntu 24.04, обнаружено {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
    - name: Минимальные ресурсы узла
      ansible.builtin.assert:
        that:
          - ansible_facts['processor_vcpus'] >= 2
          - ansible_facts['memtotal_mb'] >= 3500
        fail_msg: "Нужно ≥2 vCPU и ≥4 ГБ RAM на узел (есть {{ ansible_facts['processor_vcpus'] }} vCPU, {{ ansible_facts['memtotal_mb'] }} МБ)"
    - name: Ровно один control-plane узел
      ansible.builtin.assert:
        that: groups['control_plane'] | length == 1

- name: Подготовка всех узлов
  hosts: k8s_cluster
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Control plane
  hosts: control_plane
  become: true
  roles:
    - control_plane

- name: Worker-узлы
  hosts: workers
  become: true
  roles:
    - worker

- name: Приведение узлов к CIS Kubernetes Benchmark
  hosts: k8s_cluster
  become: true
  roles:
    - cis
