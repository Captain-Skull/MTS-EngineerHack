{{- $pki := .Values.etcd.pkiPath }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          priorityClassName: system-cluster-critical
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: snapshot
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command:
                - etcdctl
                - --endpoints=https://$(HOST_IP):{{ .Values.etcd.port }}
                - --cacert={{ $pki }}/ca.crt
                - --cert={{ $pki }}/healthcheck-client.crt
                - --key={{ $pki }}/healthcheck-client.key
                - snapshot
                - save
                - /work/snapshot.db
              env:
                - name: HOST_IP
                  valueFrom:
                    fieldRef: { fieldPath: status.hostIP }
              securityContext: &secure
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - { name: pki, mountPath: {{ $pki }}, readOnly: true }
                - { name: work, mountPath: /work }
            - name: verify
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: [etcdutl, snapshot, status, /work/snapshot.db, --write-out=table]
              securityContext: *secure
              resources: {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: store
              image: "{{ .Values.helperImage.repository }}:{{ .Values.helperImage.tag }}@{{ .Values.helperImage.digest }}"
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  file="/backups/etcd-snapshot-${ts}.db"
                  cp /work/snapshot.db "${file}.tmp"
                  mv "${file}.tmp" "${file}"
                  ls -1t /backups/etcd-snapshot-*.db | tail -n +$((RETENTION + 1)) | xargs -r rm -f
                  echo "snapshot saved: ${file} ($(stat -c %s "${file}") bytes)"
                  echo "stored snapshots: $(ls -1 /backups/etcd-snapshot-*.db | wc -l) (retention ${RETENTION})"
              env:
                - { name: RETENTION, value: {{ .Values.retention | quote }} }
              securityContext: *secure
              resources: {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: backups, mountPath: /backups }
          volumes:
            - name: pki
              hostPath: { path: {{ $pki }}, type: Directory }
            - name: work
              emptyDir: { sizeLimit: 2Gi }
            - name: backups
              hostPath: { path: {{ .Values.hostPath }}, type: DirectoryOrCreate }
