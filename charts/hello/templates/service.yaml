apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello.fullname" . }}
  labels: {{- include "hello.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "hello.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
    - { name: metrics, port: 9113, targetPort: metrics, protocol: TCP }
