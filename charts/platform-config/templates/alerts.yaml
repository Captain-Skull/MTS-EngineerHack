apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mts-hack
  namespace: monitoring
spec:
  groups:
    - name: hello.recording
      interval: 30s
      rules:
        - record: hello:requests:rate5m
          expr: sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/demo/hello/.*"}[5m]))
        - record: hello:errors5xx:ratio5m
          expr: |
            sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/hello/.*", envoy_response_code_class="5"}[5m]))
            /
            sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/demo/hello/.*"}[5m]))
        - record: hello:latency_ms:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/demo/hello/.*"}[5m])))
        - record: hello:requests_by_version:rate5m
          expr: sum by (version) (rate(nginx_http_requests_total{namespace="demo"}[5m]))

    - name: hello.alerts
      rules:
        - alert: HelloNoReadyReplicas
          expr: kube_deployment_status_replicas_available{namespace="demo", deployment=~"hello-v.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.deployment {{ "}}" }}: нет готовых реплик"
            description: "Deployment не имеет ни одного готового пода — версия приложения недоступна."
        - alert: HelloTargetDown
          expr: up{namespace="demo", job=~"hello-v.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }}: Prometheus не может собрать метрики"
            description: "Цель {{ "{{" }} $labels.instance {{ "}}" }} недоступна для scrape 5 минут."

    - name: gateway.alerts
      rules:
        - alert: GatewayProxyUnavailable
          expr: |
            sum(kube_deployment_status_replicas_available{namespace="{{ .Values.gateway.namespace }}", deployment=~"envoy-.*"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Нет готовых подов Envoy для Gateway {{ .Values.gateway.name }}"
            description: "Внешний трафик к приложениям не обслуживается."
        - alert: GatewayRateLimiting
          expr: sum(rate(envoy_http_local_rate_limit_rate_limited[5m])) > 1
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Gateway отклоняет запросы по rate limit ({{ "{{" }} $value | humanize {{ "}}" }}/с)"
            description: "Клиенты получают 429. Проверьте источник нагрузки или пересмотрите лимит."

    - name: logging.alerts
      rules:
        - alert: FluentdNoRecordsSent
          expr: sum(rate(fluentd_output_status_emit_records[10m])) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Fluentd не отправляет логи в Loki"
            description: "За 10 минут ни один экземпляр Fluentd не отправил ни одной записи."
        - alert: FluentdOutputErrors
          expr: sum by (pod) (increase(fluentd_output_status_num_errors[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }}: ошибки отправки логов"
            description: "Fluentd получает ошибки от Loki и повторяет отправку; растёт буфер на диске узла."
        - alert: FluentdBufferGrowing
          expr: fluentd_output_status_buffer_queue_length > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }}: очередь буфера {{ "{{" }} $value {{ "}}" }} chunk-ов"
            description: "Loki не успевает принимать логи или недоступен."
        - alert: LokiDown
          expr: absent(up{job="logging/loki"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Loki недоступен"
            description: "Хранилище логов не отвечает Prometheus 5 минут; Fluentd копит логи в буфере."

    - name: certificates.alerts
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Сертификат {{ "{{" }} $labels.name {{ "}}" }} истекает через {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: "cert-manager не продлил сертификат заранее — проверьте Certificate и Issuer."
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Сертификат {{ "{{" }} $labels.name {{ "}}" }} не готов"
            description: "cert-manager не может выпустить сертификат; HTTPS может перестать работать."
