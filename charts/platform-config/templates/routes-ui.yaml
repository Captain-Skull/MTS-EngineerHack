{{- $root := . }}
{{- range $name, $ui := .Values.ui }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $ui.namespace }}
spec:
  parentRefs:
    - name: {{ $root.Values.gateway.name }}
      namespace: {{ $root.Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ $name }}.{{ $root.Values.domain }}
  rules:
    - backendRefs:
        - name: {{ $ui.service }}
          port: {{ $ui.port }}
{{- if $ui.basicAuth }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}-basic-auth
  namespace: {{ $ui.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  basicAuth:
    users:
      name: basic-auth
{{- end }}
{{- end }}
