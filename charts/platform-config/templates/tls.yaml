apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mts-hack-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: MTS Hack Demo CA
  secretName: mts-hack-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mts-hack-ca
spec:
  ca:
    secretName: mts-hack-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-{{ .Values.domain | replace "." "-" }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: gateway-tls
  dnsNames:
    - {{ .Values.domain | quote }}
    - "*.{{ .Values.domain }}"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: mts-hack-ca
    kind: ClusterIssuer
