domain: demo.test

gateway:
  name: public
  namespace: envoy-gateway-system
  className: eg
  routeNamespaceLabel: mts-hack/gateway-access
  proxyReplicas: 2

canaryWeight: 10

rateLimit:
  requests: 100
  unit: Second

ui:
  grafana:
    namespace: monitoring
    service: kube-prometheus-stack-grafana
    port: 80
    basicAuth: false
  prometheus:
    namespace: monitoring
    service: kube-prometheus-stack-prometheus
    port: 9090
    basicAuth: true
  alertmanager:
    namespace: monitoring
    service: kube-prometheus-stack-alertmanager
    port: 9093
    basicAuth: true
  hubble:
    namespace: kube-system
    service: hubble-ui
    port: 80
    basicAuth: true

slo:
  window: 7d
  availability:
    objective: 0.999
  latency:
    objective: 0.99
    thresholdMs: 250

tracing:
  samplingRate: 100
  collector:
    service: opentelemetry-collector
    namespace: tracing
    port: 4317
