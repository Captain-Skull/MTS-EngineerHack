apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Образы только по digest
    policies.kyverno.io/description: >-
      Тег можно перезаписать в реестре, digest — нет. В пространствах приложений
      каждый контейнер должен ссылаться на образ по @sha256.
spec:
  validationActions: [{{ .Values.imageDigest.action }}]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ toJson .Values.imageDigest.namespaces }}
  validations:
    - message: образ должен быть указан по digest (image@sha256:…)
      expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:')) &&
        object.spec.?initContainers.orValue([]).all(c, c.image.contains('@sha256:'))
