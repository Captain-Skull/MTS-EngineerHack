deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    max_line_size: 256KB
    max_line_size_truncate: true
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  sidecar: false
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }

monitoring:
  serviceMonitor:
    enabled: true
